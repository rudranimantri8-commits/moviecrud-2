<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Movie CRUD Using Fetch & Firebase</title>
 <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.2.0/css/all.min.css">
 <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>

 <div class="container">
 <div class="col-md-12 alin-self-center d-flex justify-content-between">
 <a href="index.html" class="logo">
 <img src="https://www.svgrepo.com/show/303196/netflix-2-logo.svg">
 </a>

 <div class="col-md-6 align-self-center text-right mt-1">
 <button class="btn btn-sm btn-danger" id="addMovieBtn">
 Add Movie </button>
 </div>
 </div>

 <div class="row justify-content-center d-none" id="movieFormContainer">

 <div class="col-md-7 mb-5 mt-5">

 <div class="card">

 <div class="card-header d-flex justify-content-between align-items-center">
 <h4 class="text-left mb-0"> ADD MOVIE </h4>
 <button type="button" class="close" id="closeIcon">&times;</button>
 </div>

 <div class="card-body">

 <form id="form">

 <div class="form-group">
 <label for="movieinput">Movie Name</label>
 <input required id="movieinput" class="form-control" placeholder="Enter Movie Name">
 </div>

 <div class="form-group">
 <label for="movieratinginput">Movie Rating</label>
 <select required name="rating" id="movieRating" class="form-control"
 placeholder="Enter Movie Rating">

 <option value="">Select Rating</option>
 <option value="1">1</option>
 <option value="2">2</option>
 <option value="3">3</option>
 <option value="4">4</option>
 <option value="5">5</option>
 <option value="6">6</option>
 <option value="7">7</option>
 <option value="8">8</option>
 <option value="9">9</option>
 <option value="10">10</option>

 </select>
 </div>

 <div class="form-group">
 <label for="movieimageinput">Movie Image</label>
 <input required id="movieimageinput" class="form-control"
 placeholder="Enter Movie Image URL">
 </div>

 <div class="form-group">
 <label for="movieYearInput">Movie Year</label>
 <input required id="movieYearInput" class="form-control" placeholder="Enter Movie Year">
 </div>
 <div class="form-group">
 <label for="moviedescriptioninput">Movie Description</label>

 <textarea id="moviedescriptioninput" class="form-control" rows="3"
 placeholder="Enter movie description"></textarea>
 </div>

 <div class="card-footer d-flex justify-content-between">
 <button class="btn btn-sm btn-primary" id="addmoviebtn">
 Add Movie
 </button>

 <button class="btn btn-sm btn-primary d-none" id="updatemoviebtn" type="button">
 Update Movie
 </button>

 <button class="btn btn-sm btn-danger" id="closemoviebtn" type="button">
 close
 </button>
 </div>

 </form>

 </div>

 </div>

 </div>

 </div>

 </div>

 <div class="container-fluid">
 <div class="row" id="movieContainer"></div>
 </div>

 <div class="spinner d-none" id="spinner">
 <div class="spinner-border" role="status">
 <span class="sr-only">Loading...</span>
 </div>
 </div>

 <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
 <script src="./assets/js/app.js"></script>

</body>

</html>
